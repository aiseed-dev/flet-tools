[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-publish"
dynamic = ["version"]
description = "Deploy to Cloudflare Pages, R2 and Workers from Python — no wrangler, no npm, no Node.js."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aiseed-dev" }]
keywords = ["cloudflare", "pages", "r2", "workers", "deploy", "static-site",
            "direct-upload", "wrangler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["httpx>=0.27", "blake3>=0.4"]

[project.urls]
Homepage = "https://github.com/aiseed-dev/flet-tools/tree/main/cf-publish"
Repository = "https://github.com/aiseed-dev/flet-tools"
Changelog = "https://github.com/aiseed-dev/flet-tools/blob/main/cf-publish/CHANGELOG.md"

[project.scripts]
cf-publish = "cf_publish.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cf_publish"]

# バージョンの実体は __init__.py の __version__ だけ（pywashi/pyasciidocと
# 同じ方式）。pyproject 側と二重定義だと食い違う（0.2.1 リリース時に
# __init__.py が 0.2.0 のままで --version が誤表示になった）。
[tool.hatch.version]
path = "src/cf_publish/__init__.py"
