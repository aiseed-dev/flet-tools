name: test cf-publish

on:
  push:
    branches: [main]
    paths: ["cf-publish/**", ".github/workflows/test-cf-publish.yml"]
  pull_request:
    paths: ["cf-publish/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-publish
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q
